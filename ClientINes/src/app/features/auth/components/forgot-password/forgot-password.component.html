<div class="inest-form-page">
  <div class="inest-form-card">

    <header class="inest-form-header">
      <div class="logo-circle">
        <i class="fa fa-key"></i>
      </div>
      <h2>{{ 'FORGOT_PASSWORD_PAGE.TITLE' | translate }}</h2>
      <p>{{ 'FORGOT_PASSWORD_PAGE.SUBTITLE' | translate }}</p>
    </header>

    @if (message) {
      <div class="inest-status-box success">
        <i class="fa fa-paper-plane"></i>
        <span>{{ message | translate }}</span>
      </div>
    } @else {
      <form (ngSubmit)="onSubmit()" #forgotForm="ngForm">
        <div class="inest-form-group">
          <label>{{ 'AUTH_PAGE.EMAIL' | translate }}</label>
          <div class="inest-input-wrapper">
            <i class="fa fa-envelope inest-field-icon-left"></i>
            <input 
              type="email" 
              [(ngModel)]="email" 
              name="email" 
              required 
              autocomplete="email"
              [placeholder]="'AUTH_PAGE.EMAIL_PHL' | translate">
          </div>
        </div>

        @if (error) {
          <div class="inest-status-box error">
            <i class="fa fa-exclamation-triangle"></i>
            {{ error | translate }}
          </div>
        }

        <button 
          type="submit" 
          class="inest-btn-primary" 
          [disabled]="!forgotForm.valid || isLoading">
          @if (isLoading) {
            <i class="fa fa-spinner fa-spin"></i>
          } @else {
            <i class="fa fa-paper-plane"></i>
          }
          {{ 'FORGOT_PASSWORD_PAGE.SUBMIT_BTN' | translate }}
        </button>
      </form>
    }

    <footer class="inest-form-footer">
      <span>{{ 'FORGOT_PASSWORD_PAGE.REMEMBERED_PASSWORD' | translate }}</span>
      <a routerLink="/login">{{ 'AUTH_PAGE.GO_TO_LOGIN' | translate }}</a>
    </footer>

  </div>
</div>
