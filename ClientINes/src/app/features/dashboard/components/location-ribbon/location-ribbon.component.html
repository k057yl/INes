<div class="ribbon-container">
  @if (totalPages > 1) {
    <div class="ribbon-pagination-row">
      <div class="pagination-ctrl">
        <button (click)="pageChange.emit(currentPage - 1)" [disabled]="currentPage === 0">
          <i class="fa fa-chevron-left"></i>
        </button>
        <span class="page-info">{{ 'COMMON.PAGE' | translate }} {{ currentPage + 1 }}/{{ totalPages }}</span>
        <button (click)="pageChange.emit(currentPage + 1)" [disabled]="currentPage === totalPages - 1">
          <i class="fa fa-chevron-right"></i>
        </button>
      </div>
    </div>
  }

  <div class="root-ribbon-grid"
    cdkDropList
    cdkDropListOrientation="mixed"
    [cdkDropListData]="pagedLocations"
    (cdkDropListDropped)="reorder.emit($event)">

    @if (locations.length === 0) {
      <div class="global-empty-state animate-fade">
        <div class="empty-icon-wrapper">
          <i class="fa-solid fa-folder-open"></i>
        </div>
        <span>{{ 'RIBBON.EMPTY' | translate }}</span>
      </div>
    }

    @for (loc of pagedLocations; track loc.id) {
      <div class="root-chip"
        cdkDrag
        [class.active-on-board]="isLocActiveOnBoard(loc.id)"
        (click)="onLocationClick(loc.id)">
        <div class="chip-content">
          <i [className]="'fa ' + (loc.icon || 'fa-folder')" [style.color]="loc.color"></i>
          <span class="loc-name">{{ loc.name }}</span>
          @if (loc.children && loc.children.length > 0) {
            <div class="nested-info" [title]="'LOCATION_CARD.RIBBON.HAVE_TOOLTIP' | translate">
              <span class="child-count">{{ loc.children.length }}</span>
              <i class="fa fa-layer-group"></i>
            </div>
          }
        </div>
        <div class="chip-placeholder" *cdkDragPlaceholder></div>
      </div>
    }
  </div>
</div>
