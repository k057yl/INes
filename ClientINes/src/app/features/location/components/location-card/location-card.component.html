<div class="location-column" 
     [id]="'location-card-' + location.id"
     [attr.data-location-id]="location.id"
     [class.nested-location]="locationLevel > 0"
     [style.border-top-color]="effectiveColor"
     [style.background-color]="cardBackgroundStyle">

  <!-- ШАПКА ЛОКАЦИИ -->
  <div class="loc-header-wrapper">
    <div class="main-actions-area">
      
      <!-- ВЕРХНИЙ РЯД: Заголовок + Утилиты -->
      <div class="header-row top">
        <div class="title-block">
          <i [className]="'fa ' + (location.icon || 'fa-folder')" [style.color]="location.color"></i>
          <h3>{{ location.name }}</h3>
          <span class="count-badge">{{ location.items.length }}</span>
        </div>

        <div class="button-group">
          <!-- Инфо -->
          <button class="tool-btn" 
            [routerLink]="['/location', location.id]" 
            (click)="$event.stopPropagation()" 
            [title]="'COMMON.INFO' | translate">
            <i class="fa fa-eye"></i>
          </button>

          <!-- Селект перемещения -->
          <div class="select-btn-wrapper" [title]="'LOCATION_CARD.BTN.CHANGE_LOC_TOOLTIP' | translate" (click)="$event.stopPropagation()">
            <i class="fa fa-exchange-alt select-icon"></i>
            <select (change)="onMove($event)">
              <option value="" disabled selected></option>
              <option value="root"
                [disabled]="!treeService.canMoveLocation(facade.locations.flatLocations, location.id, null)">
                📁 {{'DROP_MENU.HIGHER_LEVEL' | translate}}
              </option>
              @for (target of flatLocations; track target.id) {
                <option
                  [value]="target.id"
                  [disabled]="target.id === location.id || treeService.isChildOf(target.id, location) || !treeService.canMoveLocation(facade.locations.flatLocations, location.id, target.id)">
                  {{ target.name }}
                </option>
              }
            </select>
          </div>

          <!-- Стрелки вверх/вниз (только у вложенных) -->
          @if (isNestedLocation) {
            <button class="tool-btn" (click)="moveUp.emit(location); $event.stopPropagation()" [title]="'LOCATION_CARD.BTN.UP_TOOLTIP' | translate" [disabled]="isFirst">
              <i class="fa fa-arrow-up"></i>
            </button>
            <button class="tool-btn" (click)="moveDown.emit(location); $event.stopPropagation()" [title]="'LOCATION_CARD.BTN.DOWN_TOOLTIP' | translate" [disabled]="isLast">
              <i class="fa fa-arrow-down"></i>
            </button>
          }

          <!-- Переименовать -->
          <button class="tool-btn" (click)="rename.emit(location); $event.stopPropagation()" [title]="'COMMON.RENAME' | translate">
            <i class="fa fa-edit"></i>
          </button>

          <!-- Удалить -->
          <button class="tool-btn is-danger" (click)="delete.emit(location); $event.stopPropagation()" [title]="'COMMON.DELETE' | translate">
            <i class="fa fa-trash-alt"></i>
          </button>
        </div>
      </div>

      <!-- НИЖНИЙ РЯД: Кнопки создания с текстом и тултипами -->
      <div class="header-row bottom">
        <button class="action-btn add-loc"
          [disabled]="isMaxLevelReached"
          [title]="(isMaxLevelReached ? 'LOCATION_CARD.BTN.MAX_LEVEL_TOOLTIP' : 'LOCATION_CARD.BTN.LOCATION_TOOLTIP') | translate"
          (click)="onAddLocation($event)">
          <i class="fa fa-folder-plus"></i>
          <span>{{'LOCATION_CARD.CREATE_LOCATION' | translate}}</span>
        </button>

        <button class="action-btn add-item"
          [title]="'LOCATION_CARD.BTN.ITEM_TOOLTIP' | translate"
          (click)="onAddItem($event)">
          <i class="fa fa-box"></i>
          <span>{{'LOCATION_CARD.CREATE_ITEM' | translate}}</span>
        </button>
      </div>

    </div>
  </div>

  <!-- ДРОП-ЗОНА ДЛЯ ПРЕДМЕТОВ -->
  <div cdkDropList 
    [id]="location.id" 
    [cdkDropListData]="location.items"
    [cdkDropListConnectedTo]="connectedLists"
    [cdkDropListEnterPredicate]="canDropItem"
    (cdkDropListDropped)="onItemDrop($event)"
    class="items-container"
    [class.is-empty]="location.items.length === 0">

    @for (item of location.items; track trackById($index, item)) {
      <app-item-card
        [item]="item"
        [accentColor]="effectiveColor"
        [flatLocations]="flatLocations"
        [menuOpenItemId]="openItemMenuId"
        (menuOpenedItemIdChange)="onItemMenuToggled($event)"
        (sell)="sellItem.emit($event)"
        (lend)="lendItem.emit($event)"
        (returnItem)="returnItem.emit($event)"
        (delete)="deleteItem.emit($event)"
        (move)="moveItemManual.emit($event)"
        (edit)="editItem.emit($event)"
        (statusChange)="statusChange.emit($event)">
      </app-item-card>
    }

    <!-- КНОПКА БЫСТРОГО ДОБАВЛЕНИЯ ПРИ ПУСТОЙ ЛОКАЦИИ -->
    @if (location.items.length === 0) {
      <div class="empty-drop-zone" (click)="onAddItem($event)" [title]="'LOCATION_CARD.BTN.ITEM_TOOLTIP' | translate">
        <i class="fa fa-plus"></i>
        <span>{{'LOCATION_CARD.CREATE_ITEM' | translate}}</span>
      </div>
    }
  </div>

  <!-- ВЛОЖЕННЫЕ ЛОКАЦИИ -->
  <div class="child-locations">
    @for (child of location.children; track trackById($index, child)) {
      <div class="child-location-wrapper">
        <app-location-card
          [location]="child"
          [flatLocations]="flatLocations"
          [connectedLists]="connectedLists"
          
          (itemDropped)="itemDropped.emit($event)"
          (sellItem)="sellItem.emit($event)"
          (lendItem)="lendItem.emit($event)"
          (returnItem)="returnItem.emit($event)"  
          (deleteItem)="deleteItem.emit($event)"
          (editItem)="editItem.emit($event)"      
          (moveItemManual)="moveItemManual.emit($event)" 
          (move)="move.emit($event)"
          (rename)="rename.emit($event)"
          (delete)="delete.emit($event)"
          (moveUp)="moveUp.emit($event)"
          (moveDown)="moveDown.emit($event)">
        </app-location-card>
      </div>
    }
  </div>
</div>
