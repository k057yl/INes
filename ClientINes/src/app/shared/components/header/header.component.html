<header class="header">
  <div class="header-main">

    <!-- 1. ЛЕВАЯ ЧАСТЬ: ЛОГОТИП -->
    <div class="brand-section">
      <div class="logo" [routerLink]="['/dashboard']" title="INest / Karakaţsya">
        <div class="logo-icon"></div>
      </div>
    </div>

    <!-- 2. ПРАВАЯ ЧАСТЬ: ВСЕ ДЕЙСТВИЯ -->
    <div class="actions" [class.mobile-open]="isMobileMenuOpen">
      
      <!-- ПУБЛИЧНЫЕ ЭЛЕМЕНТЫ -->
      <button type="button" class="theme-toggle" (click)="toggleTheme()" [title]="'COMMON.CHANGE_THEME_TOOLTIP' | translate">
        {{ themeService.isDarkTheme() ? '🌙' : '☀️' }}
      </button>

      <div class="lang-dropdown" [class.open]="isLangMenuOpen()">
        <button type="button" class="lang-trigger" (click)="toggleLangMenu($event)" [title]="'COMMON.CHANGE_LANGUAGE_TOOLTIP' | translate">
          <i class="fa fa-globe"></i>
          <span class="active-lang">{{ currentLang | uppercase }}</span>
          <i class="fa fa-chevron-down" [class.rotate]="isLangMenuOpen()"></i>
        </button>

        @if (isLangMenuOpen()) {
          <div class="lang-menu" (click)="$event.stopPropagation()">
            @for (lang of languages; track lang.code) {
              <button type="button" (click)="changeLang(lang.code)" [class.selected]="currentLang === lang.code">
                <span class="flag">{{ lang.flag }}</span>
                {{ lang.label }}
              </button>
            }
          </div>
        }
      </div>

      <!-- ПРИВАТНЫЕ ЭЛЕМЕНТЫ -->
      @if (user$ | async; as user) {
        
        @if (isAdmin(user)) {
          <a routerLink="/admin/feedback" routerLinkActive="active" class="icon-btn admin-trigger" title="Админка отзывов">
            <i class="fa fa-shield-alt"></i>
          </a>
        }

        <a routerLink="/settings" routerLinkActive="active" class="settings-link" [title]="'HEADER.SETTINGS' | translate">
          <i class="fa fa-cog"></i>
          <span class="desktop-only">{{ 'HEADER.SETTINGS' | translate }}</span>
        </a>

        <div class="user-box desktop-user-box" [title]="user.displayName || user.email">
          <i class="fa fa-user-circle"></i>
          <strong>{{ user.displayName || user.email }}</strong>
        </div>

        <button type="button" class="logout-icon-btn" (click)="onLogout()" [title]="'COMMON.EXIT' | translate">
          <i class="fa fa-sign-out-alt"></i>
        </button>

      }

    </div>

    <!-- МОБИЛЬНАЯ КНОПКА ГАМБУРГЕРА -->
    <div class="mobile-header-right">
      @if (user$ | async; as user) {
        <div class="user-box mobile-user-box" [title]="user.displayName || user.email">
          <i class="fa fa-user-circle"></i>
          <strong>{{ user.displayName || user.email }}</strong>
        </div>
      }

      <button type="button" class="mobile-menu-btn" (click)="isMobileMenuOpen = !isMobileMenuOpen" [class.open]="isMobileMenuOpen">
        <i class="fa" [ngClass]="isMobileMenuOpen ? 'fa-times' : 'fa-bars'"></i>
      </button>
    </div>

  </div>
</header>
