<div class="modal-backdrop" (click)="close()">
  <div class="modal-card"
    [class.is-danger]="mode === 'delete' || mode === 'password'"
    [class.is-confirm]="mode === 'confirm'"
    (click)="$event.stopPropagation()">

    <div class="modal-top-line"></div>

    <div class="modal-icon">
      <i class="fa" [ngClass]="getIcon()"></i>
    </div>

    <h3>{{ title | translate }}</h3>
    @if (message) {
      <p class="message">{{ message | translate }}</p>
    }

    <ng-content></ng-content>

    @if (mode === 'input') {
      <div class="inest-form-group">
        <input [(ngModel)]="name" #inputElement class="inest-input-styled"
          [placeholder]="placeholder | translate" (keyup.enter)="submit()">
      </div>
    }

    @if (mode === 'password') {
      <div class="inest-form-group">
        <input type="password" [(ngModel)]="name" #inputElement class="inest-input-styled"
          [placeholder]="'SETTINGS_PAGE.DELETE_ACCOUNT_PASSWORD_PLH' | translate" (keyup.enter)="submit()">
      </div>
    }

    <div class="modal-actions">
      <button class="inest-btn-cancel" (click)="close()">{{ cancelText | translate }}</button>
      <button [ngClass]="getButtonClass()" (click)="submit()" [disabled]="(mode === 'input' || mode === 'password') && !name.trim()">
        {{ getConfirmText() | translate }}
      </button>
    </div>
  </div>
</div>
